version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kampusimece_db
    restart: always
    environment:
      POSTGRES_DB: kampusimece_db
      POSTGRES_USER: yes
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: kampusimece_web
    restart: always
    depends_on:
      - db
    ports:
      - "5247:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=kampusimece_db;Username=yes;Password=postgrespassword
      - EmailSettings__AdminNotificationEmail=ysert20051@gmail.com
    volumes:
      - webuploads:/app/wwwroot/uploads

volumes:
  pgdata:
  webuploads:
